name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Pull Request에서는 배포하지 않고, main 브랜치 push에만 아래 단계 실행
      - name: Set up SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/$EC2_USER/sample-server"

          scp -i ~/.ssh/ec2-key.pem -r \
            dist package.json package-lock.json \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/sample-server/"

      - name: Install production dependencies and restart app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2-key.pem "$EC2_USER@$EC2_HOST" << 'EOF'
            cd ~/sample-server
            npm ci --omit=dev

            if pm2 describe ci-test >/dev/null 2>&1; then
              pm2 restart ci-test
            else
              pm2 start dist/main.js --name "sample-server"
            fi

            pm2 save
          EOF